model_list: []

litellm_settings:
  callbacks:
    - aquila_callback.aquila_adapter

  # UI Customization
  ui_theme_config:
    logo_url: "os.environ/UI_LOGO_URL"
  store_model_in_db: false

  # Caching Configuration (DualCache: In-Memory L1 + Redis L2)
  cache: true
  enable_redis_auth_cache: true
  cache_params:
    type: redis
    
    # L1 In-Memory Cache configuration (TTL in seconds)
    default_in_memory_ttl: 600
    
    # A scheme-explicit URL prevents a false-valued SSL option from being
    # interpreted as a request for an SSL connection by LiteLLM's Redis pool.
    url: "os.environ/REDIS_URL"

general_settings:
  # Reads PostgreSQL URL from .env variable automatically
  database_url: "os.environ/DATABASE_URL"
  custom_auth: gateway.auth.custom_auth.user_api_key_auth
  custom_auth_run_common_checks: true

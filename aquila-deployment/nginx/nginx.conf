# Local/development reverse proxy. Production adds TLS through nginx.tls.conf.
events {}

http {
    # Log the normalized path without query strings so OAuth authorization
    # codes and other sensitive parameters never enter access logs.
    log_format flit '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

    upstream flit_web {
        server web:4005;
    }

    upstream flit_gateway {
        server gateway:4010;
    }

    server {
        listen 4000;
        server_name _;

        access_log /var/log/nginx/access.log flit;
        error_log /var/log/nginx/error.log warn;
        client_max_body_size 20m;
        # SSO callback responses set several encrypted cookies. Allow their
        # combined Set-Cookie headers without rejecting the upstream response.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # LiteLLM emits private deployment, endpoint, and model-group headers.
        # The gateway is private, and the public boundary removes their values.
        proxy_hide_header X-Litellm-Model-Id;
        proxy_hide_header X-Litellm-Model-Api-Base;
        proxy_hide_header X-Litellm-Model-Group;

        location = /v1/chat/completions {
            proxy_pass http://flit_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            # This marker is created only by a gateway worker's private
            # classifier self-call. Public callers cannot opt into the bypass.
            proxy_set_header X-Aquila-Internal-Purpose "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location = /v1/responses {
            proxy_pass http://flit_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Aquila-Internal-Purpose "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location = /v1/models {
            # Keep LiteLLM's native catalog private. The public path resolves
            # to Aquila's principal-filtered stable-ID catalog.
            proxy_pass http://flit_gateway/v1/aquila/models;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_read_timeout 30s;
        }

        location / {
            proxy_pass http://flit_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_read_timeout 60s;
        }
    }
}
